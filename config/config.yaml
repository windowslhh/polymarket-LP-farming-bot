# Polymarket LP Farming Bot Configuration
# Goal: Maximize airdrop eligibility while minimizing losses
# Core: 高奖励 + 低波动 + 低竞争 (NOT chasing mainstream markets)

polymarket:
  host: "https://clob.polymarket.com"
  chain_id: 137  # Polygon mainnet
  signature_type: 2  # 0=EOA, 1=Magic/email, 2=Browser wallet (OKX/MetaMask)

strategy:
  # Calibrated for $500 USDC total capital
  # Airdrop farming philosophy: post near OUTER EDGE of reward zone, not tight to mid.
  # Let competitive bots absorb adverse selection. We sit safely inside reward boundary.
  spread_bps: 200               # Minimum spread floor (never go tighter than this)
  spread_target_pct: 0.80       # Target 80% of each market's max_spread (outer edge strategy)
                                 # e.g. max_spread=350bps → we post at 280bps (safe zone)
  order_size_usdc: 30           # $30 base per layer
  max_order_size_usdc: 80       # Cap auto-sizing for high min_shares markets
  order_levels: 2               # 2 layers per side
  level_spacing_bps: 100        # Extra spread per level (100bps)
  refresh_interval_sec: 5       # Requote every 5s (was 15s — faster response to price moves)
  market_refresh_interval_sec: 300

risk:
  # Capital: $500 → usable ~$450 (keep $50 buffer)
  max_position_per_market: 150  # YES+NO combined per market (2×2×$30=$120, +buffer)
  max_total_position: 400       # All markets combined; leaves $100 buffer
  daily_loss_limit: 10          # 2% of $500; conservative early-stage limit
  inventory_skew_limit: 60      # Net YES-NO exposure triggering max skew adjustment
  min_days_to_expiry: 7
  min_probability: 0.15
  max_probability: 0.85
  midpoint_change_pause_pct: 10
  # Shield depth: USDC depth ahead of our bid in the orderbook
  shield_depth_low: 100         # < $100 ahead → retreat to 95% of max_spread
  shield_depth_ok: 300          # >= $300 ahead → safe at 80% of max_spread
  # Fill rate: fills per hour before widening spread
  fill_rate_warn: 5             # > 5 fills/hr → widen by +8%
  fill_rate_danger: 10          # > 10 fills/hr → widen by +15%

market_selection:
  max_markets: 3                # 3 markets × ~$150 each = $450 (fits $500)
  # --- Reward compliance ---
  require_rewards: true
  min_reward_pool: 1.0
  max_reward_pool: 50.0         # Lowered: big reward pools = more bots = more adverse selection
  # --- Volatility filter ---
  max_volatility_cents: 8.0     # Max historical std dev in ¢/day (< 5¢ ideal)
  # --- Volume thresholds ---
  min_daily_volume: 200         # Lowered: niche markets have less volume
  # --- Category priority ---
  # New philosophy: niche/low-competition > mainstream/high-volume
  # Tier 1 (best): Sports, Science, Weather, Culture
  # Tier 2 (good): Finance, Economics, Tech
  # Tier 3 (careful): Politics
  # Tier 4 (avoid): Crypto (esp. Up/Down), Geopolitics
  prefer_categories:
    - "Sports"                  # Niche sports: low competition, predictable
    - "Science"                 # Long cycle, almost no sudden news
    - "Weather"                 # Very predictable, low competition
    - "Culture"                 # Pop culture, slow-moving
    - "Finance"                 # 50% rebate but more competitive
    - "Economics"               # Decent rewards, medium competition
    - "Tech"                    # SpaceX etc., long cycle
  # --- Blacklist ---
  avoid_categories:
    - "Crypto Up/Down"          # Bot arms race, worst red ocean
  avoid_keywords:
    - "up or down"
    - "above or below"
    - "5-minute"
    - "15-minute"

# ═══════════════════════════════════════════════════════════
# Volume Farming Strategy
# Goal: Buy high-probability outcomes to generate trading volume for airdrop
# Directional bets with dynamic stop-loss, NOT market-making
# ═══════════════════════════════════════════════════════════
volume_farming:
  enabled: false                    # Set true or use --volume-farm to enable

  # --- Market selection ---
  min_probability: 0.90             # Only buy >=90% probability outcomes
  max_probability: 0.99             # Skip 99%+ (too thin profit margin)
  min_daily_volume: 1000            # Need liquidity for stop-loss exits
  max_markets: 5                    # Max concurrent positions
  min_days_to_expiry: 3             # At least 3 days (time to react)
  max_days_to_expiry: 30            # Max 30 days (control capital lockup)
  min_bid_depth_usdc: 200           # Min bid-side depth for exits
  max_spread_pct: 0.03              # Max 3% bid-ask spread
  min_annualized_return: 0.15       # Min 15% annualized return after fees

  # --- Position sizing (Kelly criterion) ---
  kelly_fraction: 0.25              # 1/4 Kelly (conservative)
  max_position_pct: 0.02            # Single position cap: 2% of capital
  max_total_exposure_pct: 0.10      # Total volume farming exposure: 10% of capital

  # --- Stop-loss (three-layer defense) ---
  # Layer 1: EV stop (probability drops below breakeven - buffer)
  ev_buffer: 0.02                   # 2% buffer below breakeven before triggering
  ev_persistence_minutes: 5.0       # Must stay below threshold for 5 min
  # Layer 2: Drawdown stop (dynamic by entry probability)
  drawdown_by_entry_prob:
    "0.97": 0.03                    # 97% entry -> tolerate 3% drawdown
    "0.95": 0.05                    # 95% entry -> tolerate 5% drawdown
    "0.92": 0.08                    # 92% entry -> tolerate 8% drawdown
    "0.90": 0.10                    # 90% entry -> tolerate 10% drawdown
  # Layer 3: Hard stop (absolute floor)
  hard_stop_probability: 0.75       # Below 75% -> unconditional exit

  # --- Drift velocity monitoring ---
  drift_sigma_threshold: 2.0        # Drift > 2σ/day -> emergency exit
  drift_history_minutes: 60         # Use last 60 min for drift calculation

  # --- P/L ratio ---
  pl_ratio_min: 0.20                # P/L ratio < 1:5 -> reduce position by half

  # --- Near-expiry risk ---
  expiry_alert_days: 7              # Extra caution within 7 days of expiry

  # --- Portfolio risk (VaR) ---
  max_daily_drawdown_pct: 0.05      # Max 5% daily portfolio drawdown

  # --- Execution ---
  check_interval_sec: 30            # Check positions every 30s
  market_refresh_interval_sec: 600  # Scan for new markets every 10 min
  exit_timeout_sec: 60              # Limit order timeout before crossing spread

# ═══════════════════════════════════════════════════════════
# Capital allocation (when running both LP + volume farming)
# ═══════════════════════════════════════════════════════════
capital_allocation:
  lp_farming_pct: 0.80              # 80% for LP market-making ($400/$500)
  volume_farming_pct: 0.10          # 10% for volume farming ($50/$500)
  reserve_pct: 0.10                 # 10% buffer ($50/$500)
